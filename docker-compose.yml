version: "3.9"

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    env_file:
      - .env
    networks:
      - internal

  nginx:
    build:
      context: ./nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    networks:
      - internal

networks:
  internal:
    driver: bridge
